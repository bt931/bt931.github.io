<!doctype html>
<html>
  <head>
    <title>bouncy box</title>
    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body>
    <img
      id="bouncingBox"
      hidden
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzosHHskjpTofOm-1r5jtrwvktFOuRqEapepnhV7a7TpuyU4w:https://i.scdn.co/image/ab67616d0000b273071b95635babf102d5d379ca&s"
    />
    <canvas
      id="canvas"
      height="1040"
      width="1890"
      style="border: 1px solid white"
    >
    </canvas>
  </body>
</html>
<script>
  let boxX = 50;
  let boxY = 50;
  let deltaX = 5;
  let deltaY = 5;
  let canvas = document.getElementById("canvas");
  let bouncingBox = document.getElementById("bouncingBox");
  let ctx = canvas.getContext("2d");
  setInterval(moveBox, 50);
  ctx.clearRect(boxX - i * 2, boxY - i * 2, 50, 50);
  function moveBox() {
    for (let i = 0; i < 10; i = i + 1) {
      ctx.drawImage(bouncingBox, boxX + i * 20, boxY + i * 20, 50, 50);
      boxX += i * 20;
      boxY += i * 20;
    }
  }
</script>
